ref: vault.transit_decrypt
label: "Vault Transit Decrypt To Key"
description: "Decrypt Transit ciphertext directly into a pack-owned encrypted Attune Key. Plaintext never enters output."
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: transit_decrypt.py
parameter_delivery: stdin
parameter_format: json
output_format: json
parameters:
  credential_key: {type: string, default: vault_credentials}
  mount: {type: string, default: transit, required: true}
  key_name: {type: string, required: true}
  ciphertext: {type: string, required: true, secret: true}
  output_key: {type: string, required: true, description: "Pack-owned encrypted Attune Key plaintext sink."}
  timeout_seconds: {type: integer, default: 15, minimum: 1, maximum: 60}
output_schema:
  ok: {type: boolean, required: true}
  output_key: {type: string, required: true}
tags: [vault, transit, decrypt, secret-sink]
