ref: vault.transit_sign
label: "Vault Transit Sign"
description: "Sign UTF-8 input with an existing Transit signing key. Input is treated as secret; signature is persisted in Attune output."
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: transit_sign.py
parameter_delivery: stdin
parameter_format: json
output_format: json
parameters:
  credential_key: {type: string, default: vault_credentials}
  mount: {type: string, default: transit, required: true}
  key_name: {type: string, required: true}
  input: {type: string, required: true, secret: true}
  hash_algorithm: {type: string, default: sha2-256, enum: [sha2-224, sha2-256, sha2-384, sha2-512]}
  timeout_seconds: {type: integer, default: 15, minimum: 1, maximum: 60}
output_schema:
  ok: {type: boolean, required: true}
  signature: {type: string, required: true}
tags: [vault, transit, sign]
