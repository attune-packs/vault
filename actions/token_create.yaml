ref: vault.token_create
label: "Vault Create Bounded Token To Key"
description: "Create a non-root child token with explicit policies and bounded TTL, then store it directly in a pack-owned encrypted Attune Key. Requires exact CREATE TOKEN: sorted,policies confirmation."
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: token_create.py
parameter_delivery: stdin
parameter_format: json
output_format: json
parameters:
  credential_key: {type: string, default: vault_credentials}
  output_key: {type: string, required: true, description: "Pack-owned encrypted Attune Key token sink."}
  policies: {type: array, required: true, description: "Explicit policy names. root is always denied."}
  ttl_seconds: {type: integer, required: true, minimum: 60, maximum: 86400}
  renewable: {type: boolean, default: false}
  no_default_policy: {type: boolean, default: true}
  num_uses: {type: integer, default: 0, minimum: 0, maximum: 10000}
  token_type: {type: string, default: service, enum: [service, batch]}
  display_name: {type: string, default: attune}
  wrap_ttl_seconds: {type: integer, minimum: 1, maximum: 3600}
  confirmation: {type: string, required: true}
  timeout_seconds: {type: integer, default: 15, minimum: 1, maximum: 60}
output_schema:
  ok: {type: boolean, required: true}
  output_key: {type: string, required: true}
  wrapped: {type: boolean, required: true}
  wrap_ttl_seconds: {type: integer}
  lease_duration_seconds: {type: integer}
  renewable: {type: boolean}
  policies: {type: array}
tags: [vault, token, create, privileged, secret-sink]
