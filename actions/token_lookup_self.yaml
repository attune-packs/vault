ref: vault.token_lookup_self
label: "Vault Token Lookup Self"
description: "Return minimal metadata for the bootstrap token; never returns its token or accessor. Action outputs are persisted by Attune."
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: token_lookup_self.py
parameter_delivery: stdin
parameter_format: json
output_format: json
parameters:
  credential_key: {type: string, default: vault_credentials}
  timeout_seconds: {type: integer, default: 15, minimum: 1, maximum: 60}
output_schema:
  ok: {type: boolean, required: true}
  display_name: {type: string}
  policies: {type: array}
  ttl_seconds: {type: integer}
  renewable: {type: boolean, required: true}
  orphan: {type: boolean, required: true}
  token_type: {type: string}
  namespace: {type: string}
tags: [vault, token, status]
