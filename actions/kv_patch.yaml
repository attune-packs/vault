ref: vault.kv_patch
label: "Vault KV v2 Patch"
description: "Native KV v2 JSON merge patch with mandatory CAS; performs no preliminary secret read and no retry."
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: kv_patch.py
parameter_delivery: stdin
parameter_format: json
output_format: json
parameters:
  credential_key: {type: string, default: vault_credentials}
  mount: {type: string, default: secret, required: true}
  path: {type: string, required: true}
  kv_version: {type: integer, default: 2, enum: [2], required: true}
  data: {type: object, required: true, secret: true, description: "Fields to merge; JSON null removes a field."}
  cas: {type: integer, required: true, minimum: 1}
  timeout_seconds: {type: integer, default: 15, minimum: 1, maximum: 60}
output_schema:
  ok: {type: boolean, required: true}
  kv_version: {type: integer, required: true}
  version: {type: integer}
tags: [vault, kv, patch]
