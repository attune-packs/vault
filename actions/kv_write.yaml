ref: vault.kv_write
label: "Vault KV Write"
description: "Write secret data to KV v1/v2 once. Use CAS for concurrency-safe KV v2 writes."
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: kv_write.py
parameter_delivery: stdin
parameter_format: json
output_format: json
parameters:
  credential_key: {type: string, default: vault_credentials}
  mount: {type: string, default: secret, required: true}
  path: {type: string, required: true}
  kv_version: {type: integer, default: 2, enum: [1, 2], required: true}
  data: {type: object, required: true, secret: true, description: "Secret object; delivered over stdin and never returned."}
  cas: {type: integer, minimum: 0, description: "KV v2 check-and-set version; 0 means create only."}
  timeout_seconds: {type: integer, default: 15, minimum: 1, maximum: 60}
output_schema:
  ok: {type: boolean, required: true}
  kv_version: {type: integer, required: true}
  version: {type: integer}
tags: [vault, kv, write]
