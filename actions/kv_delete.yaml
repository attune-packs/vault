ref: vault.kv_delete
label: "Vault KV Delete"
description: "Delete KV v1 data permanently or soft-delete KV v2 latest/specified versions. KV v1 requires DELETE KV V1: mount/path."
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: kv_delete.py
parameter_delivery: stdin
parameter_format: json
output_format: json
parameters:
  credential_key: {type: string, default: vault_credentials}
  mount: {type: string, default: secret, required: true}
  path: {type: string, required: true}
  kv_version: {type: integer, default: 2, enum: [1, 2], required: true}
  versions: {type: array, description: "KV v2 versions; omit to soft-delete latest."}
  confirmation: {type: string, description: "Required only for permanent KV v1 deletion."}
  timeout_seconds: {type: integer, default: 15, minimum: 1, maximum: 60}
output_schema:
  ok: {type: boolean, required: true}
  kv_version: {type: integer, required: true}
  versions: {type: array, required: true}
  deleted: {type: boolean, required: true}
tags: [vault, kv, delete, destructive]
