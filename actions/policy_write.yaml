ref: vault.policy_write
label: "Vault Policy Write"
description: "Create or replace an ACL policy once. This can escalate privileges and requires exact WRITE POLICY: name confirmation."
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: policy_write.py
parameter_delivery: stdin
parameter_format: json
output_format: json
parameters:
  credential_key: {type: string, default: vault_credentials}
  name: {type: string, required: true}
  policy: {type: string, required: true, description: "Vault HCL or JSON policy document."}
  confirmation: {type: string, required: true}
  timeout_seconds: {type: integer, default: 15, minimum: 1, maximum: 60}
output_schema:
  ok: {type: boolean, required: true}
  name: {type: string, required: true}
  written: {type: boolean, required: true}
tags: [vault, policy, write, privileged]
