ref: vault.policy_list
label: "Vault Policy List"
description: "List ACL policy names. Names and action outputs are persisted by Attune."
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: policy_list.py
parameter_delivery: stdin
parameter_format: json
output_format: json
parameters:
  credential_key: {type: string, default: vault_credentials}
  timeout_seconds: {type: integer, default: 15, minimum: 1, maximum: 60}
output_schema:
  ok: {type: boolean, required: true}
  policies: {type: array, required: true}
tags: [vault, policy, list]
