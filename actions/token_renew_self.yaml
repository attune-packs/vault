ref: vault.token_renew_self
label: "Vault Token Renew Self"
description: "Renew the bootstrap token once. Vault may cap or ignore the requested increment."
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: token_renew_self.py
parameter_delivery: stdin
parameter_format: json
output_format: json
parameters:
  credential_key: {type: string, default: vault_credentials}
  increment_seconds: {type: integer, minimum: 1, maximum: 86400}
  timeout_seconds: {type: integer, default: 15, minimum: 1, maximum: 60}
output_schema:
  ok: {type: boolean, required: true}
  lease_duration_seconds: {type: integer}
  renewable: {type: boolean, required: true}
tags: [vault, token, renew]
